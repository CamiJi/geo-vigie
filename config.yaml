# geo-vigie — configuration
# ─────────────────────────────────────────────────────────────────────
# Sources contrôlées depuis un poste public le 2026-10-05.
# Certaines répondent HTTP 200 mais ne livrent aucune donnée d'offre ; seules
# les sources actives ci-dessous ont une structure d'offres vérifiée.
# ─────────────────────────────────────────────────────────────────────

general:
  lang: fr
  timezone: Europe/Paris
  max_description_chars: 1500   # troncature avant envoi au LLM (coût)
  request_delay_seconds: 1     # délai entre les sources, usage léger

# ── Profils ──────────────────────────────────────────────────────────
# Depuis le passage multiprofil (2026-10-21, voir MULTIPROFIL.md), les
# règles propres à une personne vivent dans `profiles/<id>/profile.yaml` :
# mots-clés, CV, seuils de scoring, sujet de rapport, mailer.
# Ce fichier ne garde que le PARTAGÉ : généralités et sources.
# `common.load_config()` fusionne ce fichier + un profil ; avec un profil
# unique actif, il est choisi automatiquement.

# ── Sources ──────────────────────────────────────────────────────────
# type: json | rss
# json : items_path = chemin vers la liste, fields = mapping
sources:
  - name: arbeitnow
    type: json
    enabled: true
    url: https://www.arbeitnow.com/api/job-board-api
    items_path: data
    fields:
      title: title
      company: company_name
      location: location
      url: url
      description: description
      posted_at: created_at
    # API paginée : la 1re page suffit pour un relevé quotidien.
    # Retirer `enabled: true` si le périmètre Europe vous semble trop large.

  - name: jobicy
    type: json
    enabled: true
    url: "https://jobicy.com/api/v2/remote-jobs?count=50&tag=engineering"
    items_path: jobs
    fields:
      title: jobTitle
      company: companyName
      location: jobGeo
      url: url
      description: jobDescription
      posted_at: pubDate

  - name: remotive
    type: json
    enabled: true
    url: "https://remotive.com/api/remote-jobs?limit=50"
    items_path: jobs
    fields:
      title: title
      company: company_name
      location: candidate_required_location
      url: url
      description: description
      posted_at: publication_date

  # International / anglais : Reed rend des annonces géologiques réelles,
  # y compris des postes graduate/junior. robots.txt autorise /jobs/.
  - name: reed-uk-geologist
    type: next_json
    enabled: true
    url: https://www.reed.co.uk/jobs/geologist-jobs
    url_prefix: https://www.reed.co.uk
    items_path: props.pageProps.searchResults.jobs
    fields:
      title: jobDetail.jobTitle
      company: jobDetail.ouName
      location: jobDetail.displayLocationName
      url: url
      description: jobDetail.jobDescriptionSnippet
      posted_at: jobDetail.dateCreated

  # EGU publie des annonces en anglais. Plusieurs requêtes de mots-clés
  # limitent la liste aux géosciences ; les doublons entre requêtes sont
  # supprimés par fingerprint. robots.txt n'interdit pas /jobs/.
  - name: egu-geology
    type: egu
    enabled: true
    url: "https://www.egu.eu/jobs/search/?keywords=geology&limit=50"

  - name: egu-geoscience
    type: egu
    enabled: true
    url: "https://www.egu.eu/jobs/search/?keywords=geoscience&limit=50"

  - name: egu-mineral-exploration
    type: egu
    enabled: true
    url: "https://www.egu.eu/jobs/search/?keywords=mineral%20exploration&limit=50"

  # France : pages de résultats publiques, chemins sans query string.
  # Les règles robots.txt consultées autorisent ces URLs; cadence globale 1/s.
  - name: hellowork-geologue
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/metier_geologue.html

  - name: hellowork-geologie
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/mot-cle_geologie.html

  - name: france-travail-geologue
    type: france_travail
    enabled: true
    url: https://candidat.francetravail.fr/offres/emploi/geologue/s19m4

  # ── Hôtellerie / management (profil gabriela, étape 4 — 2026-10-21) ──
  # Balayage + robots.txt vérifiés le 2026-10-21 (voir MULTIPROFIL.md).
  # Le matching par profil (table matches) filtre ensuite : ces offres ne
  # sont gardées que pour les profils dont les mots-clés les matchent.

  # Jobboard du journal L'Hôtellerie-Restauration : cards HTML, filtre
  # région, pagination ?page=N. robots.txt n'interdit pas /emploi/ publics.
  - name: lhotellerie-restauration
    type: lhotellerie
    enabled: true
    url: https://www.lhotellerie-restauration.fr/emploi/emploi-hotel-restaurant

  # Michael Page : management/finance, cards avec lieu, contrat, SALAIRE et
  # télétravail (injectés en description → plancher salarial au scoring).
  # robots.txt autorise /jobs et /job-detail.
  - name: michaelpage-jobs
    type: michaelpage
    enabled: true
    url: https://www.michaelpage.fr/jobs

  # Journal des Palaces : RSS officiel de la section carrière (offres
  # hôtellerie de luxe FR/international). Désactivé le 2026-11-10 : le nano
  # reçoit un 403 sur le flux (filtrage Cloudflare de l'IP datacenter, quel
  # que soit le User-Agent) alors qu'il répond depuis le poste de travail.
  # Réactiver seulement si le flux redevient joignable depuis le serveur.
  - name: journaldespalaces-rss
    type: rss
    enabled: false
    url: https://www.journaldespalaces.com/carriere/feed/rss.xml
    max_items: 50
    fields:
      title: title
      company: society
      location: locality
      url: link
      posted_at: published
      description: description

  # HelloWork / France Travail : requêtes dédiées hôtellerie en plus des
  # recherches géologie (fetchers existants, URL testées 200 avec cartes).
  - name: hellowork-directeur-hotel
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/metier_directeur-d-hotel.html

  - name: hellowork-hotellerie-restauration
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/mot-cle_hotellerie-restauration.html

  - name: france-travail-directeur-hotel
    type: france_travail
    enabled: true
    url: "https://candidat.francetravail.fr/offres/recherche?motsCles=directeur%20hotel"

  # ── Direction d'établissement & hébergement (ajout 2026-11-10) ───────
  # Le catalogue manquait de postes de direction réellement en IDF : les
  # sources précédentes ratissent national et la page 1 est dominée par la
  # province. Ces pages métier HelloWork ramènent 5 à 7 cartes IDF sur 20
  # (mesuré le 2026-11-10), dont des directions d'établissement EHPAD.
  - name: hellowork-directeur-etablissement
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/metier_directeur-d-etablissement.html

  - name: hellowork-adjoint-direction-hotel
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/metier_adjoint-direction-hotel.html

  - name: hellowork-directeur-residence-hoteliere
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/metier_directeur-residence-hoteliere.html

  - name: hellowork-responsable-hotelier
    type: hellowork
    enabled: true
    url: https://www.hellowork.com/fr-fr/emploi/metier_responsable-hotelier.html

  # EURAXESS est en pause : le formulaire de recherche est en POST et le
  # paramètre keyword de l'URL testée ne filtrait pas les cartes observées.
  # Ne pas l'activer avant d'avoir résolu et testé le vrai contrat de recherche.
  # France Travail : API officielle à clé gratuite, intégration après création
  # du client OAuth sur le portail développeur.
  # Refusées au test : Google News (presse, pas des offres), APEC/Indeed/Jooble
  # (403), URLs carrière BRGM/Andra testées (404/HTML vide), Jobicy/Remotive/
  # Arbeitnow restent des agrégateurs généralistes à faible rendement géologie.
  # Earthworks Jobs retiré : ses conditions interdisent les outils automatisés
  # de scraping/navigation (terms §2.7), malgré un JSON-LD techniquement lisible.
  # LinkedIn exclu : pas d'API publique de recherche et scraping interdit par ToS.

# ── Scoring / rapport ────────────────────────────────────────────────
# (déplacés dans profiles/<id>/profile.yaml)

