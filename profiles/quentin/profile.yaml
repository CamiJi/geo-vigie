# geo-vigie — profil quentin
# ─────────────────────────────────────────────────────────────────────
# Migré à l'identique de l'ancien config.yaml mono-profil le 2026-10-21
# (étape 1 du plan MULTIPROFIL.md). Aucune règle n'a été modifiée ici :
# seuls le découpage et les chemins changent.
# ─────────────────────────────────────────────────────────────────────

id: quentin
label: "Quentin"
active: true

# CV utilisé pour le scoring, relatif à ce dossier (gitignoré).
# Si absent, score.py retombe sur cv/geologue-placeholder.md.
cv_file: cv.txt

# Mots-clés : une offre est gardée si elle contient AU MOINS un terme pertinent
# et AUCUN terme `exclude`. Matching à frontière de mot, insensible aux
# accents/casse (voir common.py → keyword_match).
#
#   include_strong : distinctifs (géolog, métallogénie…) → cherchés partout
#                    (titre + description + lieu)
#   include_weak   : génériques (terrain, ressources…) → TITRE SEULEMENT
#                    → sinon « développement de carrières » ou le mot allemand
#                      « Terminierung » (qui contient "minier") font passer
#                      n'importe quelle offre
keywords:
  include_strong:
    # Géosciences — le cœur du sujet
    - géolog
    - hydrogéolog
    - hydrogeolog
    - géotechni
    - geotechni
    - pédolog
    - pedolog
    - géophysique
    - geophysic
    - géochimie
    - geochem
    - métallogén
    - metallogeny
    - pétrolier
    - petrolier
    - pétrole
    - petroleum
    - hydrocarbure
    - sismique
    - carottage
    - core logging
    - ore deposit
    - mineral exploration
    - exploration geologist
    # Mines / extraction / exploration (profil candidat)
    - gisement
    - gisements
    - gisement
    - mineralisation
    - réservoir
    - reservoir
    - extractif
    # Familles élargies
    - geoscience
    - earth science
    - bassin versant
    - hydrologie
    - geothermal
    - géothermie

  include_weak:
    # Termes de secteur génériques — TITRE UNIQUEMENT
    - mining
    - minier
    - minière
    - mine
    - exploration
    - forage
    - drill
    - deposit
    - dépôt

  exclude:
    # Ne jamais les chercher dans la description pour `include_*` :
    # on écarte l'offre entière si le terme apparaît n'importe où.
    - stage
    - stagiaire
    - internship
    - intern
    - alternance
    - apprentiss
    - pédago        # évite "pédagogue"
    - doctorat      # le profil fourni est de niveau Master, sans PhD
    - phd
    - post-doctorat
    - postdoc
    - postdoctoral
    - alternant

# ── Scoring ──────────────────────────────────────────────────────────
scoring:
  # Quentin reste sur le modèle historique du nano (gemini) : la bascule
  # vers MiMo n'a pas été décidée pour lui, seulement benchée (21/10).
  # Pour basculer : remplacer par "xiaomi/mimo-v2.6-flash" (11× moins cher
  # à la tâche, cf. README/bench_cost.py).
  model: "google/gemini-3.7-flash"  # aligné sur le .env du nano
  min_score: 55              # seuil qualité : les adéquations faibles restent masquées
  top_n: 15                  # nombre max d'offres dans le mail
  temperature: 0

# ── Rapport ──────────────────────────────────────────────────────────
report:
  # Objet du mail — {date} et {count} sont remplacés.
  subject: "[geo-vigie] {count} offre(s) — {date}"
  # Sections du rapport, dans l'ordre.
  sections:
    - top          # offres notées >= min_score
    - discarded    # compact : celles filtrées par mots-clés
  send_empty: false          # true = mail quand même si 0 offre
