# geo-vigie — profil gabriela
# ─────────────────────────────────────────────────────────────────────
# Profil hôtellerie / management (étape 5 du plan MULTIPROFIL.md).
# Matière : profil LinkedIn brut du 2026-10-21 (perso/00-inbox, traité).
# Décisions produit : geo Île-de-France en filtre DUR depuis le 21/10
# (recadrage de Camille — élimination avant notation LLM), plancher
# salarial 2 200 € net/mois (signal neutre en fin de justification),
# niveau de poste au minimum équivalent à directrice adjointe d'hôtel,
# posture « sonder le marché » (→ baromètre).
# ─────────────────────────────────────────────────────────────────────

id: gabriela
label: "Gabriela"
active: true

# CV utilisé pour le scoring, relatif à ce dossier (gitignoré).
cv_file: cv.txt

# Persona injecté en tête du prompt de scoring (contrat MULTIPROFIL.md).
persona: >-
  Tu es un recruteur senior en hôtellerie-restauration et management
  d'établissements, habitué des profils opérationnels (direction adjointe,
  gestion de restaurant, événements et banquets, revenue management). Tu
  évalues la pertinence d'une offre pour un profil précis, dans une
  démarche de sondage du marché plus que de recherche captive : une offre
  hors cible mais représentative du secteur garde de la valeur
  d'information.

# Géographie : MALUS + COUPURE DURE au-delà de 45 km (recadrage 2026-11-11).
# Le malus seul laissait passer des offres à 60-70 km quand leur score brut
# était très haut (ex. 82/100 à 57 km). Le géocodage BAN fournit la
# distance réelle (lat/lon stockés dans `offers`) ; au-delà de `max_km`,
# l'offre est éliminée sauf mention de télétravail/remote dans le lieu.
# Lieu vide ou non géocodable → repli sur le motif `pattern` (comportement
# historique). Quentin, lui, n'a aucun `geo_filter` : il est mobile.
geo_filter:
  soft: true
  max_km: 45
  # Périmètre : IDF + couronne ~45 km (fallback motif si pas de coordonnées).
  pattern: '(?i)\b(?:75|77|78|9[1-5]|28|27|60)\b|paris|île-de-france|ile-de-france|\bIDF\b'
  penalty: 25

location:
  base: "Fontenay-le-Fleury (78)"
  zones: ["Île-de-France", "couronne ~45 km"]
  remote: "accepté"
  relocation: "non"

# Mots-clés : une offre est gardée si AU MOINS un terme pertinent matche
# et AUCUN terme `exclude` (voir common.py → keyword_match).
#
#   include_strong : termes distinctifs → titre OU ≥ 2 termes dans le corps
#                    (hôtel, restaurant, housekeeping, revenue manager…)
#   include_weak   : génériques → TITRE SEULEMENT (directeur, responsable…)
#                    → évite que « manager » ou « responsable » decriptions
#                      quelconques fassent entrer le catalogue entier
keywords:
  include_strong:
    # Hôtellerie — cœur du profil
    - hôtel
    - hotel
    - hospitality
    - resort
    # Restauration / cuisine
    - restaura          # restaurant, restauration, restaurateur
    - cuisin            # cuisine, cuisinier
    - food and beverage
    - food & beverage
    - banquet
    - sommelier
    - barman
    - bartender
    - pâtissier
    - patissier
    # Métiers hôteliers
    - housekeeping
    - front office
    - reception         # réception, réceptionniste, réceptionnables
    - gouvernant
    - concierge
    - revenue management
    - revenue manager
    - rooms division
    - femme de chambre
    - valet de chambre
    - spa
    # Tourisme / événementiel (elle a géré événements & banquets)
    - tourisme
    - tourism
    - séminaire
    - seminaire
    - événement
    - evenement
    # Hébergement médico-social (cible explicite : EHPAD, résidences)
    - ehpad
    - médico-social
    - medico-social
    - maison de retraite
    - résidence services
    - residence services

  include_weak:
    # Titre seulement — management (niveau et cible de la candidate)
    - directeur
    - directrice
    - responsable
    - gérant

  exclude:
    # Écarte l'offre entière si le terme apparaît n'importe où.
    - stage
    - stagiaire
    - internship
    - alternance
    - apprentiss
    - alternant

  exclude_title:
    # Postes hiérarchiquement moindres que directeur/directrice adjointe
    # d'hôtel : écartés sur le TITRE seulement (le terme peut apparaître
    # légitimement dans la description d'une offre de direction).
    - responsable de salle
    - chef de rang
    - maitre d hotel
    - receptionniste
    - commis
    - gouvernant
    - assistante gouvernante
    - femme de chambre
    - valet de chambre
    - barman
    - barista
    - concierge
    - bagagiste
    - serveur
    - serveuse
    - cuisinier
    - chef de partie
    - second de cuisine
    - sous-chef de cuisine
    - patissier
    - plongeur
    - room attendant
    - agent de maintenance
    - agent hotelier
    - technicien
    - vendeur
    - vendeuse
    - boulanger
    - bouch

# ── Scoring ──────────────────────────────────────────────────────────
scoring:
  model: "xiaomi/mimo-v2.6-flash"  # override du .env (LLM_MODEL) — testé le 21/10/2026
  min_salary_net_month: 2200   # plancher : génère la règle de score (score.py)
  salary_signal: tail          # salaire absent = neutre, mention en fin (recadrage 21/10)
  min_score: 55                # seuil qualité : les adéquations faibles restent masquées
  top_n: 15                    # nombre max d'offres dans le mail
  temperature: 0
  weights: |
    - 50 % adéquation des compétences métier (management d'équipes, opérations,
      accueil, process, revenue management) avec le CV
    - 25 % niveau de responsabilité (direction adjointe / responsabilité
      d'établissement) par rapport au poste
    - 25 % secteur, type de poste et type de contrat
    (La géographie n'entre PAS dans la note : le moteur applique lui-même
    un malus hors périmètre après l'évaluation.)
  rules: |
    - Géographie : le moteur applique un malus selon la distance réelle
      (géocodage BAN, Base Adresse Nationale) et élimine au-delà de 45 km,
      sauf mention de télétravail/remote dans le lieu. N'intègre pas la
      distance dans la note ; signale-la seulement dans la justification
      quand elle est évidente. Un poste hors périmètre mais excellent
      reste masqué (pas de mail) — c'est le choix fait le 2026-11-11.
    - Niveau de poste : Gabriela est directrice adjointe d'hôtel. Les postes
      opérationnels d'exécution — cuisine, salle (responsable de salle, chef
      de rang, maître d'hôtel), réception, housekeeping, commis, gouvernante,
      vendeur — sont des dégradations de poste : plafonne à 30 avec le
      verdict « hors-profil ». À l'inverse, la voie commerciale (sales
      manager, business development), le yield/revenue management et la
      direction générale sont des trajectoires de management qu'elle
      envisage : ne les plafonne JAMAIS pour « niveau inférieur », évalue-les
      sur leur adéquation réelle (compétences, secteur, géo, salaire).
    - Ouverture au changement de secteur : valorise les qualités
      transversales (management d'équipes, accueil, responsabilité,
      optimisation des process). L'hébergement médico-social (EHPAD,
      résidence, médicalisé) partage l'essentiel des compétences (gestion
      d'établissement, équipes opérationnelles, accueil des résidents et
      des familles, qualité) : un poste de responsable ou adjoint
      d'établissement y est pertinent, sans exigence de télétravail.
    - Si l'offre est vague ou une arnaque plausible, plafonne à 40.
    - La justification doit être actionnable : le candidat doit comprendre
      pourquoi en lisant 2 phrases.

# ── Rapport ──────────────────────────────────────────────────────────
report:
  # Objet du mail — {date} et {count} sont remplacés.
  subject: "[vigie-gabriela] {count} offre(s) — {date}"
  # Sections du rapport, dans l'ordre.
  sections:
    - top          # offres notées >= min_score
    - discarded    # compact : celles filtrées par mots-clés
  # Relevé vide : mail informatif (baromètre + seuil), avec un objet dédié
  # qui ne ressemble pas à un rapport à 0 offre.
  #   "cc"  = envoyé aux seules adresses en copie (Camille) — test/monitoring
  #   true  = envoyé aussi au candidat ; false = silence
  send_empty: "cc"
  subject_empty: "[vigie-gabriela] Aucune nouvelle offre — {date}"

# Mailer dédié (consommé par report.py dès l'étape 6) : elle reçoit sur
# sa boîte, Camille en copie — même SMTP Brevo global que quentin.
mailer:
  to: gabrielascavo@gmail.com
  cc: aubertcam@gmail.com
